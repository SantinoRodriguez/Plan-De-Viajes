<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lugares - Detalle del Viaje</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg mt-2">
            <div class="container-fluid">
                <a class="navbar-brand" href="../index.html">Plan de Viajes</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end " id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="explore.html">Explorar</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="travels.html">Mis Viajes</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="prices.html">Precio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="log_in.html"><span class="login-link"><i
                                        class="fa fa-user-circle"></i> Iniciar Sesión</span></a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <section class="hero-section container-fluid py-1">
        <div class="hero-box mb-5">
            <div class="container col-lg-7">
                <div class="container mt-3">
                    <a href="travels.html" class="text-decoration-none fw-bold mb-3 d-inline-block"><i class="fa fa-arrow-left"></i> Volver a Mis Viajes</a>
                </div>
                <div class="d-flex flex-column flex-md-row gap-4 align-items-center align-items-md-start">
                    <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23eee'/></svg>" alt="Cargando..." class="trip-img" id="detalles-viaje-img" style="opacity: 0.5;">
                    <div class="flex-grow-1 text-center text-md-start">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h2 class="mb-0" id="detalles-viaje-titulo">Obteniendo viaje...</h2>
                            <button class="btn btns fw-bold px-3 py-1" id="btn-editar-lugares" disabled>Editar</button>
                        </div>
                        <p class="mb-2 fw-semibold text-secondary" id="detalles-viaje-fechas"><i class="fa-solid fa-circle-notch fa-spin me-2"></i> Cargando detalles...</p>
                        <div class="mb-3" id="detalles-viaje-tags">
                            <!-- Se cargan dinámicamente -->
                        </div>
                        <a href="share.html" class="btn btns px-4 py-1 fw-bold disabled" id="detalles-viaje-btn-compartir"><i class="fa fa-share-alt me-2"></i>Compartir</a>
                    </div>
                </div>

                <div class="nav-tabs-custom mb-3">
                    <a href="itinerario.html" id="tab-itinerario">Itinerario</a>
                    <a href="lugares.html" class="active" id="tab-lugares">Lugares</a>
                    <a href="presupuesto.html" id="tab-presupuesto">Presupuesto</a>
                    <a href="memories_details.html" id="tab-recuerdos">Recuerdos</a>
                </div>
            </div>
        </div>
    </section>

    <main class="container col-lg-6 mb-5">
        <div class="card2 rounded-4 p-4 border border-dark shadow-sm">
            <div class="places-header">
                <h3 class="mb-0">Lugares Guardados</h3>
                <div class="view-toggles">
                    <button class="view-btn active" id="btn-card-view" title="Vista de Tarjetas"><i class="fa fa-th-large"></i></button>
                    <button class="view-btn" id="btn-list-view" title="Vista de Lista"><i class="fa fa-list"></i></button>
                </div>
            </div>

            <!-- Contenedor para agregar lugar durante la edición -->
            <div id="lugar-edicion-container" class="d-none my-3 p-3 bg-light rounded-3 border">
                <label class="form-label fw-bold mb-1 text-secondary text-uppercase" style="font-size: 0.72rem; letter-spacing: 0.5px;">Buscar nuevo lugar para visitar:</label>
                <div class="add-btn-row mt-1">
                    <input type="text" id="buscar-lugares" class="add-input shadow-sm" placeholder="Buscar lugares mágicos...">
                    <button class="add-icon-btn primary shadow-sm" id="btn-add-lugar"><i class="fa fa-plus"></i></button>
                </div>
            </div>

            <div id="places-container">
                <!-- Se inyectan dinámicamente -->
            </div>
        </div>
    </main>

    <footer>
        <p class="text-center mt-5 mb-3">&copy; 2026 Plan de Viajes. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/maps-config.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnCardView = document.getElementById('btn-card-view');
            const btnListView = document.getElementById('btn-list-view');
            const placesContainer = document.getElementById('places-container');

            btnCardView.addEventListener('click', () => {
                btnCardView.classList.add('active');
                btnListView.classList.remove('active');
                placesContainer.classList.remove('places-list-view');
            });

            btnListView.addEventListener('click', () => {
                btnListView.classList.add('active');
                btnCardView.classList.remove('active');
                placesContainer.classList.add('places-list-view');
            });
        });
    </script>
</body>
</html>

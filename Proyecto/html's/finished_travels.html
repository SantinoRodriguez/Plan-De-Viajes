<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viajes Realizados</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg mt-2">
            <div class="container-fluid">
                <a class="navbar-brand" href="../index.html">Plan de Viajes</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end " id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="explore.html">Explorar</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="travels.html">Mis Viajes</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="prices.html">Precio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="log_in.html"><span class="login-link"><i
                                        class="fa fa-user-circle"></i> Iniciar Sesión</span></a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <section class="hero-section container-fluid py-1">
        <div class="hero-box">
            <div class="col-lg-8 mx-auto">
                <div class="d-flex flex-column justify-content-center p-4 p-lg-5">
                    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-4">
                        <div>
                            <h1 class="mb-1 hero-title">Viajes Realizados</h1>
                            <p class="mt-1 mb-0">Tu historial de aventuras</p>
                        </div>
                        <a href="make_travel.html" class="btn btns hero-btn mt-3 mt-sm-0 text-decoration-none">+ Planificar nuevo viaje</a>
                    </div>
                    <div class="row g-3 text-center justify-content-center">
                        <div class="col-6 col-sm-3">
                            <div class="card2 rounded-3 border border-dark ratio ratio-1x1 shadow-sm">
                                <div class="w-100 h-100 d-flex flex-column align-items-center justify-content-center">
                                    <span id="stats-viajes" class="d-block fw-bold fs-1 text-dark">0</span>
                                    <span class="text-muted fw-bold small uppercase" style="letter-spacing: 0.5px;">Viajes</span>
                                </div>
                            </div>
                        </div>
                        <div class="col-6 col-sm-3">
                            <div class="card2 rounded-3 border border-dark ratio ratio-1x1 shadow-sm">
                                <div class="w-100 h-100 d-flex flex-column align-items-center justify-content-center">
                                    <span id="stats-paises" class="d-block fw-bold fs-1 text-dark">0</span>
                                    <span class="text-muted fw-bold small uppercase" style="letter-spacing: 0.5px;">Países</span>
                                </div>
                            </div>
                        </div>
                        <div class="col-6 col-sm-3">
                            <div class="card2 rounded-3 border border-dark ratio ratio-1x1 shadow-sm">
                                <div class="w-100 h-100 d-flex flex-column align-items-center justify-content-center">
                                    <span id="stats-lugares" class="d-block fw-bold fs-1 text-dark">0</span>
                                    <span class="text-muted fw-bold small uppercase" style="letter-spacing: 0.5px;">Lugares</span>
                                </div>
                            </div>
                        </div>
                        <div class="col-6 col-sm-3">
                            <div class="card2 rounded-3 border border-dark ratio ratio-1x1 shadow-sm">
                                <div class="w-100 h-100 d-flex flex-column align-items-center justify-content-center">
                                    <span id="stats-dias" class="d-block fw-bold fs-1 text-dark">0</span>
                                    <span class="text-muted fw-bold small uppercase" style="letter-spacing: 0.5px;">Días</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <main class="container py-4 col-12 col-lg-8 mx-auto">
        <div class="d-flex flex-wrap gap-2 mb-3">
            <button class="btn btns">Todos</button>
            <button class="btn btn-outline-secondary">2026</button>
            <button class="btn btn-outline-secondary">2025</button>
            <button class="btn btn-outline-secondary">Europa</button>
            <button class="btn btn-outline-secondary">America</button>
        </div>
        <div id="viajes-realizados-grid" class="row g-3 mb-3">
            <!-- Los viajes realizados se inyectarán aquí desde el backend -->
        </div>
        <div id="paginacion-container" class="d-flex justify-content-center gap-2">
            <button id="pag-prev" class="pag-btn pag-arrow btn rounded-circle border-0"><i class="fa fa-chevron-left"></i></button>
            <div id="pag-numeros" class="d-flex gap-2">
                <!-- Se inyectarán dinámicamente -->
            </div>
            <button id="pag-next" class="pag-btn pag-arrow btn rounded-circle border-0"><i class="fa fa-chevron-right"></i></button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Plan de Viajes. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/script.js"></script>
</body>

</html>
